    .r1 { animation-delay: .2s } .r2 { animation-delay: .35s } .r3 { animation-delay: .5s } .r4 { animation-delay: .65s }
    .r5 { animation-delay: .8s } .r6 { animation-delay: .95s } .r7 { animation-delay: 1.1s } .r8 { animation-delay: 1.25s }
    .scan { animation: scan 5s cubic-bezier(.45,0,.55,1) 1.6s infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes row { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    @keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(304px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; opacity: 1; } .scan { animation-duration: 10s; } }
  </style>

