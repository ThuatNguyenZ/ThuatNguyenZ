  <title id="t">TABLE public.engineer — Nguyen Thien Thuat</title>
  <desc id="d">name Nguyen Thien Thuat; role Data Engineer; focus pipelines, warehousing, monitoring; studying M.Sc. Artificial Intelligence at University of Science, VNU-HCM; research recommender systems and NLP; based in Ho Chi Minh City, Vietnam; motto: fearless in exploration, meticulous in creation; status shipping.</desc>
