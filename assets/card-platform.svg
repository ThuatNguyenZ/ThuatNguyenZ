<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-labelledby="t">
  <title id="t">BA3 Data Platform — sources, lake, warehouse and product, monitored end to end</title>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".05"/></pattern>
    <radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#00F0FF" stop-opacity=".18"/><stop offset="1" stop-color="#00F0FF" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="560" height="220" rx="12"/></clipPath>
    <path id="p" d="M40 120 H520"/>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .flow { stroke-dasharray: 3 7; animation: flow 1.4s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -30; } }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="560" height="220" fill="#08090C"/>
    <rect width="560" height="220" fill="url(#dots)"/>
    <circle cx="470" cy="40" r="180" fill="url(#g)"/>
    <text x="24" y="36" class="mono" font-size="11" letter-spacing="1.5" fill="#00F0FF">// 01 · FEATURED PLATFORM</text>
    <text x="24" y="68" class="sans" font-size="26" font-weight="800" letter-spacing="-.5" fill="#F8FAFC">BA3 DATA PLATFORM</text>

    <path d="M40 132 H520" stroke="#00F0FF" stroke-opacity=".25"/>
    <path d="M40 132 H520" stroke="#00F0FF" class="flow"/>
    <circle r="3" fill="#00F0FF"><animateMotion dur="4s" repeatCount="indefinite" path="M40 132 H520"/></circle>
    <circle r="3" fill="#10B981"><animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M40 132 H520"/></circle>

    <g class="mono" font-size="10" letter-spacing="1" text-anchor="middle">
      <rect x="24" y="114" width="104" height="36" fill="#0E1015" stroke="#1E2230"/><text x="76" y="136" fill="#F8FAFC">SOURCES</text>
      <rect x="152" y="114" width="104" height="36" fill="#0E1015" stroke="#1E2230"/><text x="204" y="136" fill="#F8FAFC">DATA LAKE</text>
      <rect x="280" y="114" width="120" height="36" fill="#0E1015" stroke="#00F0FF"/><text x="340" y="136" fill="#00F0FF">WAREHOUSE</text>
      <rect x="424" y="114" width="112" height="36" fill="#0E1015" stroke="#1E2230"/><text x="480" y="136" fill="#F8FAFC">PRODUCT</text>
    </g>
    <rect x="24" y="166" width="512" height="26" fill="rgba(16,185,129,.06)" stroke="#10B981" stroke-opacity=".45" stroke-dasharray="3 4"/>
    <circle class="pulse" cx="40" cy="179" r="3.5" fill="#10B981"/>
    <text x="52" y="183" class="mono" font-size="10.5" letter-spacing="1" fill="#10B981">MONITORING — across every stage · alerts before anyone asks</text>
  </g>
  <rect x=".5" y=".5" width="559" height="219" rx="12" fill="none" stroke="#1E2230"/>
</svg>
