<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="104" viewBox="0 0 1200 104" role="img" aria-label="03 · PUBLISHED RESEARCH — peer-reviewed work on recommendation &amp; NLP">
  <defs>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>
    <path id="down" d="M28 0 V104"/>
    <path id="across" d="M112 78 H1172"/>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .flow { stroke-dasharray: 3 7; animation: flow 1.4s linear infinite; }
    .pulse { transform-origin: 28px 44px; animation: pulse 2.4s ease-in-out infinite; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) .1s forwards; }
    .grow { transform-origin: 112px 78px; transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) .2s forwards; }
    @keyframes flow { to { stroke-dashoffset: -30; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.9); opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
  <rect width="1200" height="104" fill="#F7F8FA" rx="10"/>

  <use href="#down" stroke="#4F46E5" stroke-opacity=".25" stroke-width="1.5"/>
  <use href="#down" stroke="#4F46E5" stroke-width="1.5" class="flow"/>
  <circle r="3" fill="#4F46E5"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#down"/></animateMotion></circle>

  <circle class="pulse" cx="28" cy="44" r="9" fill="none" stroke="#4F46E5"/>
  <circle cx="28" cy="44" r="9" fill="#F7F8FA" stroke="#4F46E5" stroke-width="2"/>
  <circle cx="28" cy="44" r="3.5" fill="#4F46E5"/>
  <path d="M37 44 H54" stroke="#4F46E5" stroke-width="1.5"/>

  <g class="rise">
    <text x="60" y="58" class="mono" font-size="40" font-weight="700" fill="none" stroke="#4F46E5" stroke-width="1.2" letter-spacing="1">03</text>
    <text x="134" y="56" class="sans" font-size="32" font-weight="800" letter-spacing="-.5" fill="#0F172A">PUBLISHED RESEARCH</text>
    <text x="1172" y="38" class="mono" font-size="11" letter-spacing="2" fill="#4F46E5" text-anchor="end">STAGE · ENRICH</text>
    <text x="1172" y="58" class="mono" font-size="12" fill="#475569" text-anchor="end">peer-reviewed work on recommendation &amp; NLP</text>
  </g>

  <rect class="grow" x="112" y="77" width="1060" height="2" fill="url(#rule)"/>
  <circle r="3" fill="#4F46E5" opacity=".9"><animateMotion dur="3.2s" begin="1.2s" repeatCount="indefinite"><mpath href="#across"/></animateMotion></circle>
</svg>
