<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Nguyen Thien Thuat — Data Engineer</title>
  <desc id="d">Marketplace and advertising data flow into a data lake, a warehouse and analytics, with monitoring across every stage.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#0F172A" fill-opacity="0.05"/>
    </pattern>
    <radialGradient id="glowCy" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0E7490" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0E7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowVi" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#0E7490"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="14"/></clipPath>
    <path id="m1" d="M770 142 C800 142 800 195 830 195"/>
    <path id="m2" d="M770 152 C800 152 800 195 830 195"/>
    <path id="a1" d="M770 238 C800 238 800 195 830 195"/>
    <path id="a2" d="M770 248 C800 248 800 195 830 195"/>
    <path id="e1" d="M910 195 H930"/>
    <path id="e2" d="M1040 195 H1060"/>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
    .flow { stroke-dasharray: 3 7; animation: flow 1.4s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    .blobA { animation: driftA 18s ease-in-out infinite alternate; }
    .blobB { animation: driftB 22s ease-in-out infinite alternate; }
    .scan { animation: scan 6s linear infinite; }
    .rise { opacity: 0; animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .3s } .d3 { animation-delay: .5s } .d4 { animation-delay: .7s }
    @keyframes flow { to { stroke-dashoffset: -30; } }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes driftA { to { transform: translate(140px, 40px) scale(1.1); } }
    @keyframes driftB { to { transform: translate(-120px, -50px) scale(.92); } }
    @keyframes scan { from { transform: translateX(-200px); } to { transform: translateX(1400px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation-duration: 3s; } .blobA, .blobB { animation-duration: 40s; } .scan { animation-duration: 12s; }
      .rise { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#F7F8FA"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <circle class="blobA" cx="160" cy="80" r="260" fill="url(#glowCy)"/>
    <circle class="blobB" cx="1040" cy="360" r="300" fill="url(#glowVi)"/>
    <rect class="scan" x="0" y="0" width="160" height="400" fill="url(#glowCy)" opacity="0.25"/>

    <!-- identity -->
    <g class="rise d1">
      <text x="56" y="92" class="mono" font-size="14" letter-spacing="2" fill="#0E7490">// DATA ENGINEER · HO CHI MINH CITY</text>
    </g>
    <g class="rise d2">
      <text x="54" y="160" class="sans" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#0F172A">NGUYEN THIEN</text>
      <text x="54" y="218" class="sans" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#0F172A">THUAT<tspan fill="#0E7490">.</tspan></text>
    </g>
    <g class="rise d3">
      <text x="56" y="262" class="sans" font-size="19" fill="#475569">Turning scattered commerce data into one warehouse.</text>
      <rect class="caret" x="522" y="248" width="9" height="18" fill="#0E7490"/>
    </g>
    <g class="rise d4 mono" font-size="12" fill="#475569">
      <rect x="56" y="288" width="96" height="24" fill="none" stroke="#E2E8F0"/>
      <text x="104" y="304" text-anchor="middle">PIPELINES</text>
      <rect x="160" y="288" width="112" height="24" fill="none" stroke="#E2E8F0"/>
      <text x="216" y="304" text-anchor="middle">WAREHOUSING</text>
      <rect x="280" y="288" width="104" height="24" fill="none" stroke="#E2E8F0"/>
      <text x="332" y="304" text-anchor="middle">MONITORING</text>
      <rect x="392" y="288" width="128" height="24" fill="rgba(79,70,229,0.10)" stroke="rgba(79,70,229,0.45)"/>
      <text x="456" y="304" text-anchor="middle" fill="#4338CA">M.SC. AI · NLP</text>
    </g>

    <!-- pipeline -->
    <g class="mono" font-size="11">
      <circle class="pulse" cx="656" cy="98" r="4" fill="#047857"/>
      <text x="668" y="102" fill="#475569">pipeline.status = <tspan fill="#047857">healthy</tspan></text>

      <g fill="none" stroke-width="1.3">
        <use href="#m1" stroke="#0E7490" stroke-opacity=".25"/><use href="#m1" stroke="#0E7490" class="flow"/>
        <use href="#m2" stroke="#0E7490" stroke-opacity=".25"/><use href="#m2" stroke="#0E7490" class="flow"/>
        <use href="#a1" stroke="#4F46E5" stroke-opacity=".25"/><use href="#a1" stroke="#4F46E5" class="flow"/>
        <use href="#a2" stroke="#4F46E5" stroke-opacity=".25"/><use href="#a2" stroke="#4F46E5" class="flow"/>
        <use href="#e1" stroke="#0E7490" stroke-opacity=".25"/><use href="#e1" stroke="#0E7490" class="flow"/>
        <use href="#e2" stroke="#047857" stroke-opacity=".25"/><use href="#e2" stroke="#047857" class="flow"/>
      </g>

      <circle r="3" fill="#0E7490"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#m1"/></animateMotion></circle>
      <circle r="3" fill="#0E7490"><animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite"><mpath href="#m2"/></animateMotion></circle>
      <circle r="3" fill="#4F46E5"><animateMotion dur="3.6s" begin=".6s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
      <circle r="3" fill="#4F46E5"><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
      <circle r="3" fill="#0E7490"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
      <circle r="3" fill="#047857"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>

      <rect x="650" y="128" width="120" height="36" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="710" y="150" text-anchor="middle" fill="#0F172A" letter-spacing="1">MARKETPLACES</text>
      <rect x="650" y="226" width="120" height="36" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="710" y="248" text-anchor="middle" fill="#0F172A" letter-spacing="1">AD PLATFORMS</text>

      <rect x="830" y="177" width="80" height="36" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="870" y="199" text-anchor="middle" fill="#0F172A" letter-spacing="1">LAKE</text>
      <rect x="930" y="177" width="110" height="36" fill="#FFFFFF" stroke="#0E7490"/>
      <text x="985" y="199" text-anchor="middle" fill="#0E7490" letter-spacing="1">WAREHOUSE</text>
      <rect x="1060" y="177" width="96" height="36" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="1108" y="199" text-anchor="middle" fill="#0F172A" letter-spacing="1">ANALYTICS</text>

      <g stroke="#047857" stroke-opacity=".5" stroke-dasharray="2 4">
        <path d="M830 272 H1156"/>
        <path d="M870 213 V272"/><path d="M985 213 V272"/><path d="M1108 213 V272"/>
      </g>
      <text x="830" y="296" fill="#047857">● MONITORING · automated checks · alerts</text>
    </g>

    <!-- footer rule -->
    <rect x="56" y="344" width="1088" height="1" fill="url(#rule)" opacity=".7"/>
    <text x="56" y="372" class="mono" font-size="12" fill="#64748B">python · aws · postgresql · parquet · spark · kafka · grafana</text>
    <text x="1144" y="372" class="mono" font-size="12" fill="#475569" text-anchor="end">profile-thuatnguyen.vercel.app ↗</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="14" fill="none" stroke="#E2E8F0"/>
</svg>
